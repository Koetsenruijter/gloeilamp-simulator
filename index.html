<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactieve (I,U)-karakteristiek Simulator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f7; color: #1d1d1f; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 650px; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 1.4rem; text-align: center; color: #333; margin-bottom: 15px; }
        .circuit-diagram { display: flex; justify-content: center; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px; margin-bottom: 20px; }
        .canvas-container { position: relative; width: 100%; height: 380px; margin-bottom: 20px; background: #fafafa; border: 1px solid #e5e5e5; border-radius: 8px; }
        canvas { width: 100%; height: 100%; display: block; }
        .slider-section { background: #f9f9fb; padding: 16px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee; }
        .slider-container { display: flex; align-items: center; justify-content: space-between; }
        .slider-container input { flex: 1; margin: 0 15px; }
        .slider-label { font-weight: bold; font-size: 1rem; min-width: 90px; }
        .slider-value { font-variant-numeric: tabular-nums; font-weight: bold; min-width: 45px; text-align: right; }
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
        .metric-card { background: #f5f5f7; padding: 12px; border-radius: 6px; border-left: 4px solid #ccc; }
        .metric-card.l3 { border-left-color: #2ca02c; }
        .metric-card.l12 { border-left-color: #ff7f0e; }
        .metric-label { font-size: 0.8rem; color: #666; margin-bottom: 4px; }
        .metric-value { font-size: 1.1rem; font-weight: bold; font-variant-numeric: tabular-nums; }
        .conclusion-box { background: #eef7ff; border: 1px solid #bce0ff; padding: 12px; border-radius: 6px; font-size: 0.95rem; text-align: center; font-weight: 500; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>(I,U)-karakteristiek & Evenwicht (3 Lampen, 18V)</h2>
    
    <img src="Gloeilampjes.png" style="width:100%; max-width:300px; display:block; margin:0 auto 20px;">
    
    <div class="canvas-container">
        <canvas id="graphCanvas"></canvas>
    </div>
    
    <div class="slider-section">
        <div class="slider-container">
            <span class="slider-label">Factor α:</span>
            <input type="range" id="alphaSlider" min="0.3" max="1.2" step="0.05" value="0.55">
            <span class="slider-value" id="alphaVal">0.55</span>
        </div>
    </div>
    
    <div class="metrics-grid">
        <div class="metric-card l3">
            <div class="metric-label">Lamp L3 (Serie)</div>
            <div class="metric-value" id="metricsL3">-</div>
        </div>
        <div class="metric-card l12">
            <div class="metric-label">Lamp L1 / L2 (Parallel, elk)</div>
            <div class="metric-value" id="metricsL12">-</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Vermogen L3 (P₃)</div>
            <div class="metric-value" id="powerL3">-</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Weerstandsverhouding (R₃ / R₁₂)</div>
            <div class="metric-value" id="resRatio">-</div>
        </div>
    </div>
    
    <div class="conclusion-box" id="conclusionText">-</div>
</div>

<script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('alphaSlider');
    const alphaVal = document.getElementById('alphaVal');

    const V_tot = 18;
    const V_nom = 12;
    const I_nom = 0.2;

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    const xMin = 0, xMax = 18;
    const yMin = 0, yMax = 0.4;

    function toScreenX(x, width) { const padding = 60; return padding + (x - xMin) / (xMax - xMin) * (width - padding * 1.5); }
    function toScreenY(y, height) { const padding = 50; return height - padding - (y - yMin) / (yMax - yMin) * (height - padding * 2); }

    function updateSimulation() {
        const alpha = parseFloat(slider.value);
        alphaVal.innerText = alpha.toFixed(2);
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        ctx.clearRect(0, 0, width, height);

        // Titels
        ctx.fillStyle = '#666'; ctx.font = 'bold 12px sans-serif';
        ctx.fillText('U (V)', width / 2, height - 5);
        ctx.save(); ctx.rotate(-Math.PI / 2); ctx.fillText('I (A)', -height / 2, 20); ctx.restore();

        const k = I_nom / Math.pow(V_nom, alpha);
        const V3_eq = V_tot / (1 + Math.pow(0.5, 1 / alpha));
        const I3_eq = k * Math.pow(V3_eq, alpha);
        const V12_eq = V_tot - V3_eq;
        const I12_eq = I3_eq / 2;

        // Grid X
        for (let v = 0; v <= 18; v += 3) {
            const sx = toScreenX(v, width);
            ctx.beginPath(); ctx.moveTo(sx, toScreenY(0, height)); ctx.lineTo(sx, toScreenY(0.4, height));
            ctx.strokeStyle = (v === 6 || v === 12) ? '#ccc' : '#eaeaea'; ctx.lineWidth = (v === 6 || v === 12) ? 1.5 : 1; ctx.stroke();
            ctx.fillStyle = '#666'; ctx.font = '10px sans-serif'; ctx.fillText(v.toString(), sx - 5, toScreenY(0, height) + 15);
        }
        // Grid Y
        for (let i = 0; i <= 0.4; i += 0.1) {
            const sy = toScreenY(i, height);
            ctx.beginPath(); ctx.moveTo(toScreenX(0, width), sy); ctx.lineTo(toScreenX(18, width), sy);
            ctx.strokeStyle = '#eaeaea'; ctx.lineWidth = 1; ctx.stroke();
            ctx.fillText(i.toFixed(1), toScreenX(0, width) - 25, sy + 4);
        }

        ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(toScreenX(0, width), toScreenY(0, height)); ctx.lineTo(toScreenX(18, width), toScreenY(0, height));
        ctx.moveTo(toScreenX(0, width), toScreenY(0, height)); ctx.lineTo(toScreenX(0, width), toScreenY(0.4, height)); ctx.stroke();

        ctx.strokeStyle = '#007aff'; ctx.lineWidth = 2.5; ctx.beginPath();
        for (let v = 0; v <= 18; v += 0.1) { const i = k * Math.pow(v, alpha); v === 0 ? ctx.moveTo(toScreenX(v, width), toScreenY(i, height)) : ctx.lineTo(toScreenX(v, width), toScreenY(i, height)); }
        ctx.stroke();

// Groene lijn (gestippeld)
        ctx.strokeStyle = '#2ca02c'; ctx.setLineDash([4, 4]); ctx.beginPath();
        let first = true;
        for (let v = 0; v <= 18; v += 0.1) {
            const i = 2 * k * Math.pow(Math.max(0, 18 - v), alpha);
            
            // Teken alleen als de waarde binnen de grafiekhoogte valt
            if (i >= 0 && i <= 0.4) {
                if (first) {
                    ctx.moveTo(toScreenX(v, width), toScreenY(i, height));
                    first = false;
                } else {
                    ctx.lineTo(toScreenX(v, width), toScreenY(i, height));
                }
            } else {
                // Zodra de waarde buiten bereik komt, 'reset' de lijn zodat hij niet doortrekt
                first = true;
            }
        }
        ctx.stroke();

        ctx.strokeStyle = '#ff7f0e'; ctx.setLineDash([4, 4]); ctx.beginPath(); // Oranje nu ook gestippeld
        for (let v = 0; v <= 18; v += 0.1) { const i = 0.5 * k * Math.pow(Math.max(0, 18 - v), alpha); v === 0 ? ctx.moveTo(toScreenX(v, width), toScreenY(i, height)) : ctx.lineTo(toScreenX(v, width), toScreenY(i, height)); }
        ctx.stroke();
        ctx.setLineDash([]);

        function drawDot(x, y, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(toScreenX(x, width), toScreenY(y, height), 5, 0, 2 * Math.PI); ctx.fill(); }
        drawDot(V3_eq, I3_eq, '#2ca02c'); drawDot(V12_eq, I12_eq, '#ff7f0e');

        document.getElementById('metricsL3').innerText = `${V3_eq.toFixed(2)} V / ${I3_eq.toFixed(3)} A`;
        document.getElementById('metricsL12').innerText = `${V12_eq.toFixed(2)} V / ${I12_eq.toFixed(3)} A`;
        document.getElementById('powerL3').innerText = `${(V3_eq * I3_eq).toFixed(2)} W`;
        document.getElementById('resRatio').innerText = `${(V3_eq / I3_eq / (V12_eq / I12_eq)).toFixed(2)}`;

        const concBox = document.getElementById('conclusionText');
        if (alpha < 0.95) concBox.innerText = `Conclusie (α = ${alpha}): Duidelijk PTC-gedrag. Omdat de parallellampjes (L1/L2) kouder blijven, hebben ze een lagere weerstand en verschuift het evenwicht: L3 krijgt meer spanning (${V3_eq.toFixed(1)}V) en L1/L2 krijgen juist minder spanning (${V12_eq.toFixed(1)}V) dan de nominale 12V en 6V!`;
        else if (alpha > 1.05) concBox.innerText = `Conclusie (α = ${alpha}): NTC-gedrag. De weerstand daalt bij belasting, waardoor de spanningsverhoudingen omkeren.`;
        else concBox.innerText = `Conclusie (α = ${alpha}): Lineair (Ohms) gedrag. De evenwichtspunten vallen nu exact samen met de nominale werkpunten.`;
    }

    slider.addEventListener('input', updateSimulation);
    window.addEventListener('resize', () => { resizeCanvas(); updateSimulation(); });
    resizeCanvas(); updateSimulation();
</script>

</body>
</html>
